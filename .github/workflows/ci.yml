name: Odoo 19 CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Stable M3.3 patch baseline. The real-upgrade fixture intentionally starts
  # before M3.4 so post-M3.4 fixes remain testable even if main itself needs repair.
  FACODI_PRE_M34_BASE_SHA: 1ff81c0585728037dfb24b3310d5905ce38c6fc7

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce provider-neutral discovery policy
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              "FACODI_" + "YOUTUBE" + "_API_KEY",
              "youtube." + "googleapis.com",
              "playlists." + "list",
              "YouTube Data " + "API",
          ]
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  if token in text:
                      violations.append((str(path), token))
          if violations:
              for path, token in violations:
                  print(f"Forbidden provider-specific API integration reference: {path}: {token}")
              raise SystemExit(1)
          PY

      - name: Start PostgreSQL 16
        run: |
          docker network create facodi-learning-ci
          docker run -d --name facodi-learning-db \
            --network facodi-learning-ci \
            -e POSTGRES_USER=odoo \
            -e POSTGRES_PASSWORD=odoo \
            -e POSTGRES_DB=facodi_learning_ci \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec facodi-learning-db pg_isready -U odoo -d facodi_learning_ci; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install pre-M3.4 addon for real upgrade test
        run: |
          git cat-file -e "${FACODI_PRE_M34_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$FACODI_PRE_M34_BASE_SHA" HEAD
          echo "FACODI_UPGRADE_BASE_SHA=$FACODI_PRE_M34_BASE_SHA" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/facodi-learning-baseline "$FACODI_PRE_M34_BASE_SHA"
          docker exec facodi-learning-db createdb -U odoo facodi_learning_upgrade_ci
          docker run --rm \
            --network facodi-learning-ci \
            -e HOST=facodi-learning-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v /tmp/facodi-learning-baseline:/mnt/extra-addons:ro \
            -v facodi-learning-upgrade-data:/var/lib/odoo \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 \
            --without-demo=True \
            -d facodi_learning_upgrade_ci \
            -i facodi_learning \
            --stop-after-init

      - name: Seed pre-M3.4 upgrade sentinels
        run: |
          docker run --rm -i \
            --network facodi-learning-ci \
            -e HOST=facodi-learning-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v /tmp/facodi-learning-baseline:/mnt/extra-addons:ro \
            -v facodi-learning-upgrade-data:/var/lib/odoo \
            odoo:19.0 \
            odoo shell \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 \
            -d facodi_learning_upgrade_ci \
            < scripts/ci_seed_pre_m34.py

      - name: Upgrade pre-M3.4 database to current addon
        run: |
          docker run --rm \
            --network facodi-learning-ci \
            -e HOST=facodi-learning-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            -v facodi-learning-upgrade-data:/var/lib/odoo \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 \
            --without-demo=True \
            -d facodi_learning_upgrade_ci \
            -u facodi_learning \
            --stop-after-init

      - name: Verify preserved pre-M3.4 records after real upgrade
        run: |
          docker run --rm -i \
            --network facodi-learning-ci \
            -e HOST=facodi-learning-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            -v facodi-learning-upgrade-data:/var/lib/odoo \
            odoo:19.0 \
            odoo shell \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 \
            -d facodi_learning_upgrade_ci \
            < scripts/ci_verify_post_m34.py

      - name: Install addon and run Odoo tests
        run: |
          set -o pipefail
          docker run --rm \
            --network facodi-learning-ci \
            -e HOST=facodi-learning-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            -v facodi-learning-data:/var/lib/odoo \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 \
            --without-demo=True \
            -d facodi_learning_ci \
            -i facodi_learning \
            --test-tags /facodi_learning \
            --stop-after-init \
            2>&1 | tee /tmp/facodi-current-install.log

      - name: Upload current install test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facodi-current-install-log
          path: /tmp/facodi-current-install.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upgrade addon and run regression tests
        run: |
          docker run --rm \
            --network facodi-learning-ci \
            -e HOST=facodi-learning-db -e USER=odoo -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            -v facodi-learning-data:/var/lib/odoo \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 --without-demo=True \
            -d facodi_learning_ci -u facodi_learning \
            --test-tags /facodi_learning --stop-after-init

      - name: PostgreSQL logs on failure
        if: failure()
        run: docker logs facodi-learning-db || true
